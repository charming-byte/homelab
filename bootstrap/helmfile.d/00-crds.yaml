---
# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks
    - --skip-schema-validation

repositories:
  - name: cloudnative-pg
    url: https://cloudnative-pg.github.io/charts

releases:
  - name: cloudflare-dns
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.23.0

  - name: envoy-gateway
    namespace: network
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: 1.9.3

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.25.0

  - name: kube-prometheus-stack
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    version: 92.16.1

  - name: cloudnative-pg
    namespace: default
    chart: cloudnative-pg/cloudnative-pg
    version: 0.29.1

  # No upstream Helm chart: helmfile renders the raw CRD manifests through chartify
  - name: agent-sandbox
    namespace: agent-sandbox-system
    chart: ./crds/agent-sandbox
