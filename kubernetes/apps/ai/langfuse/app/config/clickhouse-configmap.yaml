---
apiVersion: v1
kind: ConfigMap
metadata:
  name: langfuse-clickhouse-configmap
data:
  99-disable-system-logs.xml: |-
    <clickhouse>
      <trace_log remove="1"/>
      <text_log remove="1"/>
      <opentelemetry_span_log remove="1"/>
      <processors_profile_log remove="1"/>
      <metric_log remove="1"/>
      <part_log remove="1"/>
      <asynchronous_metric_log remove="1"/>
      <query_views_log remove="1"/>
      <asynchronous_insert_log remove="1"/>
      <latency_log remove="1"/>
      <query_metric_log remove="1"/>
      <error_log remove="1"/>
    </clickhouse>
