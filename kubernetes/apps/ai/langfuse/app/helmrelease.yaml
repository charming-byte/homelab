---
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse
spec:
  chartRef:
    kind: OCIRepository
    name: langfuse
  interval: 1h
  values:
    controllers:
      langfuse:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env: &langfuseEnv
              AUTH_AUTHENTIK_ALLOW_ACCOUNT_LINKING: "true"
              AUTH_DISABLE_USERNAME_PASSWORD: "true"
              CLICKHOUSE_CLUSTER_ENABLED: "false"
              CLICKHOUSE_MIGRATION_URL: clickhouse://127.0.0.1:9000
              CLICKHOUSE_URL: http://127.0.0.1:8123
              LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
              LANGFUSE_S3_BATCH_EXPORT_ENABLED: "true"
              LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://127.0.0.1:8333
              LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
              LANGFUSE_S3_BATCH_EXPORT_REGION: us-east-1
              LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://127.0.0.1:8333
              LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
              LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
              LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:8333
              LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
              LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
              NEXTAUTH_URL: https://{{ .Release.Name }}.${SECRET_DOMAIN}
              PORT: "3000"
              SMTP_CONNECTION_URL: smtp://smtp-relay
              TELEMETRY_ENABLED: "false"
            envFrom: &envFrom
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            image:
              repository: ghcr.io/langfuse/langfuse
              tag: 4.27@sha256:c9e2cab8469a5d7353e86a3252b02c52ac94ef31288ce2639ee01aabf5e4222b
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /api/public/health
                    port: 3000
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api/public/ready
                    port: 3000
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /api/public/health
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 10m
                memory: 1Gi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
          clickhouse:
            envFrom: *envFrom
            image:
              repository: clickhouse/clickhouse-server
              tag: 26.7.5@sha256:800e82865530eb2f1c4bc1b960e43b435fd9b2d83b4bd04a2564a5cfd88fdb6e
            ports:
              - containerPort: 8123
              - containerPort: 9000
            probes:
              liveness: &clickhouseProbes
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /ping
                    port: 8123
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *clickhouseProbes
            resources:
              limits:
                memory: 8Gi
              requests:
                memory: 2Gi
            securityContext: *securityContext
          seaweedfs:
            command:
              - "weed"
              - "server"
              - "-dir=/data"
              - "-s3"
              - "-s3.port=8333"
            envFrom: *envFrom
            image:
              repository: chrislusf/seaweedfs
              tag: 4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
            ports:
              - containerPort: 8333
            probes:
              liveness: &seeweedfsProbes
                custom: true
                enabled: true
                spec:
                  failureThreshold: 6
                  httpGet:
                    path: /healthz
                    port: 8333
                  initialDelaySeconds: 20
                  periodSeconds: 10
                  timeoutSeconds: 5
              readiness: *seeweedfsProbes
            resources:
              limits:
                memory: 4Gi
              requests:
                memory: 1Gi
            securityContext: *securityContext
          worker:
            env:
              <<: *langfuseEnv
              PORT: "3030"
            envFrom: *envFrom
            image:
              repository: ghcr.io/langfuse/langfuse-worker
              tag: 4.27@sha256:091a85c3c54bf5fff7cc0073a7f35a52861cc0e30d33dd05569fe3ed66b15d8d
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /api/health
                    port: 3030
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /api/health
                    port: 3030
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
            resources:
              limits:
                memory: 4Gi
              requests:
                cpu: 10m
                memory: 1Gi
            securityContext: *securityContext
        initContainers:
          init-db:
            envFrom: *envFrom
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            securityContext: *securityContext
        strategy: Recreate
      seaweedfs-lifecycle:
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        containers:
          main:
            command:
              - /bin/sh
              - "-ec"
              - |
                echo "Waiting for SeaweedFS S3 endpoint $${S3_ENDPOINT}..."

                until aws \
                  --endpoint-url "$${S3_ENDPOINT}" \
                  s3api list-buckets \
                  >/dev/null 2>&1
                do
                  sleep 5
                done

                echo "Ensuring bucket $${S3_BUCKET} exists..."

                aws \
                  --endpoint-url "$${S3_ENDPOINT}" \
                  s3api create-bucket \
                  --bucket "$${S3_BUCKET}" \
                  >/dev/null 2>&1 \
                  || echo "Bucket $${S3_BUCKET} already present"

                aws \
                  --endpoint-url "$${S3_ENDPOINT}" \
                  s3api put-bucket-lifecycle-configuration \
                  --bucket "$${S3_BUCKET}" \
                  --lifecycle-configuration file:///config/lifecycle.json

                echo "Lifecycle configuration applied"

                aws \
                  --endpoint-url "$${S3_ENDPOINT}" \
                  s3api get-bucket-lifecycle-configuration \
                  --bucket "$${S3_BUCKET}"
            env:
              AWS_DEFAULT_REGION: us-east-1
              AWS_EC2_METADATA_DISABLED: "true"
              RETENTION_DAYS: "90"
              S3_ENDPOINT: http://langfuse:8333
            envFrom: *envFrom
            image:
              repository: amazon/aws-cli
              tag: 2.36.38@sha256:269b824fd142de9de0bd6fa2e78cdcf3012c1b05f1792a8e44b30ad80680c83d
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext: *securityContext
        type: job
    defaultPodOptions:
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
    persistence:
      clickhouse-config:
        advancedMounts:
          langfuse:
            clickhouse:
              - path: /etc/clickhouse-server/config.d/99-disable-system-logs.xml
                readOnly: true
                subPath: 99-disable-system-logs.xml
        defaultMode: 493
        name: langfuse-clickhouse-configmap
        type: configMap
      clickhouse-users:
        type: emptyDir
        advancedMounts:
          langfuse:
            clickhouse:
              - path: /etc/clickhouse-server/users.d
      clickhouse-logs:
        type: emptyDir
        advancedMounts:
          langfuse:
            clickhouse:
              - path: /var/log/clickhouse-server
                subPath: clickhouse-server
      clickhouse-data:
        accessMode: ReadWriteOnce
        advancedMounts:
          langfuse:
            clickhouse:
              - path: /var/lib/clickhouse
                subPath: clickhouse
        size: 50Gi
        storageClass: local-hostpath
        type: persistentVolumeClaim
      seaweedfs-lifecycle-config:
        advancedMounts:
          seaweedfs-lifecycle:
            main:
              - path: /config/lifecycle.json
                readOnly: true
                subPath: lifecycle.json
        defaultMode: 493
        name: langfuse-seaweedfs-configmap
        type: configMap
      seeweedfs-data:
        accessMode: ReadWriteOnce
        advancedMounts:
          langfuse:
            seaweedfs:
              - path: /data
                subPath: data
        size: 50Gi
        storageClass: local-hostpath
        type: persistentVolumeClaim
      tmpfs:
        globalMounts:
          - path: /tmp
            subPath: tmp
        type: emptyDir
    route:
      app:
        annotations:
          gethomepage.dev/app: langfuse
          gethomepage.dev/enabled: "true"
          gethomepage.dev/namespace: ai
          gethomepage.dev/description: Open-source observability platform for AI applications.
          gethomepage.dev/group: AI
          gethomepage.dev/icon: sh-langfuse
          gethomepage.dev/name: Langfuse
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    service:
      app:
        controller: langfuse
        ports:
          http:
            port: 80
            primary: true
            targetPort: 3000
          s3:
            port: 8333
            targetPort: 8333
