      model: anthropic/claude-opus-5-5

  - model_name: anthropic-sonnet-5.5
    litellm_params:
      model: anthropic/claude-sonnet-5-5

  - model_name: anthropic-haiku-4.5
    litellm_params:
      model: anthropic/claude-haiku-4-5

  - model_name: chatgpt/gpt-6.1-sol
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-6.1-sol

  - model_name: chatgpt/gpt-6-astra
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-6-astra

  - model_name: chatgpt/gpt-6-sol
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-6-sol

  - model_name: chatgpt/gpt-6-luna
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-6-luna

  - model_name: chatgpt/gpt-5.6-sol
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.6-sol

  - model_name: chatgpt/gpt-5.6-terra
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.6-terra

  - model_name: chatgpt/gpt-5.6-luna
    model_info:
      mode: responses
    litellm_params:
      model: chatgpt/gpt-5.6-luna

  - model_name: github_copilot/claude-haiku-4.5
    litellm_params:
      model: github_copilot/claude-haiku-4.5

  - model_name: github_copilot/text-embedding-3-small
    model_info:
      mode: embedding
    litellm_params:
      model: github_copilot/text-embedding-3-small

  - model_name: github_copilot/text-embedding-3-small-inference
    model_info:
      mode: embedding
    litellm_params:
      model: github_copilot/text-embedding-3-small-inference

  - model_name: github_copilot/text-embedding-ada-002
    model_info:
      mode: embedding
    litellm_params:
      model: github_copilot/text-embedding-ada-002

general_settings:
  proxy_batch_write_at: 60
  database_connection_pool_limit: 10
  use_redis_transaction_buffer: true

  disable_error_logs: True
  allow_requests_on_db_unavailable: True

router_settings:
  routing_strategy: usage-based-routing-v2
  redis_host: os.environ/REDIS_HOST

litellm_settings:
  set_verbose: False
  json_logs: true
  cache: True
  cache_params:
    type: redis
  model_group_settings:
    forward_client_headers_to_llm_api:
      - anthropic-opus-5.5
      - anthropic-sonnet-5.5
      - anthropic-haiku-4.5
