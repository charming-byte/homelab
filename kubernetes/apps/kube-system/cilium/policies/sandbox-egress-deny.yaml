---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: sandbox-egress-deny
spec:
  endpointSelector:
    matchLabels:
      security.homelab/sandbox: "true"
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    # CIDRs do not match pods, nodes or the API server, see the identities below
    - toCIDRSet:
        - cidr: 0.0.0.0/8
        - cidr: 10.0.0.0/8
        - cidr: 100.64.0.0/10
        - cidr: 127.0.0.0/8
        - cidr: 169.254.0.0/16
        - cidr: 172.16.0.0/12
        - cidr: 192.0.0.0/24
        - cidr: 192.0.2.0/24
        - cidr: 192.168.0.0/16
        - cidr: 198.18.0.0/15
        - cidr: 198.51.100.0/24
        - cidr: 203.0.113.0/24
        - cidr: 224.0.0.0/4
        - cidr: 240.0.0.0/4
        - cidr: ::1/128
        - cidr: fc00::/7
        - cidr: fe80::/10
        - cidr: ff00::/8
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
        - health
        - ingress
        - unmanaged
    # LoadBalancer VIPs are translated before policy evaluation, so gateways
    # are denied by identity; envoy-external only serves public tunnel routes
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
          matchExpressions:
            - key: gateway.envoyproxy.io/owning-gateway-name
              operator: NotIn
              values: ["envoy-external"]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
          matchExpressions:
            - key: k8s-app
              operator: NotIn
              values: ["kube-dns"]
    - toEndpoints:
        - matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - actions-runner-system
                - agent-sandbox-system
                - cert-manager
                - flux-system
                - openebs-system
                - security
