---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    bpf:
      # Ref: https://github.com/siderolabs/talos/issues/10002
      hostLegacyRouting: true
      masquerade: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cni:
      exclusive: false
    dashboards:
      enabled: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false
    hubble:
      enabled: true
      # Sandbox DNS and policy verdicts to the agent log, Alloy ships them to Loki
      export:
        static:
          enabled: true
          filePath: stdout
          allowList:
            - '{"source_label":["security.homelab/sandbox=true"],"protocol":["dns"],"event_type":[{"type":129}]}'
            - '{"source_label":["security.homelab/sandbox=true"],"verdict":["AUDIT","DROPPED"]}'
            - '{"destination_label":["security.homelab/sandbox=true"],"verdict":["AUDIT","DROPPED"]}'
          fieldMask:
            - time
            - verdict
            - drop_reason_desc
            - traffic_direction
            - source.namespace
            - source.pod_name
            - destination.namespace
            - destination.pod_name
            - destination_names
            - IP
            - l4
            - l7
      metrics:
        dashboards:
          enabled: true
        enabled:
          - dns:ignoreAAAA;sourceContext=workload-name|reserved-identity;labelsContext=source_namespace,source_workload
          - drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
          - policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
          - tcp
          - icmp
        serviceMonitor:
          enabled: true
      relay:
        enabled: true
        rollOutPods: true
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      mode: dsr
    localRedirectPolicy: true
    policyAuditMode: false
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 1
      rollOutPods: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - BPF
          - CHOWN
          - DAC_OVERRIDE
          - FOWNER
          - IPC_LOCK
          - KILL
          - NET_ADMIN
          - NET_RAW
          - PERFMON
          - SETGID
          - SETUID
          - SYS_ADMIN
          - SYS_RESOURCE
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      hostNamespaceOnly: true
