---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pushgateway
spec:
  chartRef:
    kind: OCIRepository
    name: pushgateway
  interval: 1h
  values:
    extraVars:
      - name: TZ
        value: Europe/Berlin
    extraArgs:
      - --persistence.file=/data/pushgateway.data
      - --persistence.interval=5m
    fullnameOverride: pushgateway
    persistentVolume:
      enabled: true
      storageClass: local-hostpath
      size: 1Gi
    replicaCount: 1
    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/app: prometheus-pushgateway
          gethomepage.dev/description: Push acceptor for ephemeral and batch jobs
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/icon: prometheus.svg
          gethomepage.dev/name: Prometheus Pushgateway
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    serviceMonitor:
      enabled: true
      namespace: observability
      additionalLabels:
        release: pushgateway
      relabelings:
        - action: replace
          targetLabel: instance
          replacement: pushgateway
      metricRelabelings:
        - action: labeldrop
          regex: pod|container|endpoint|service
