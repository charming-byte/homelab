---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-external-access-logs
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: loki
      inputName: DS_LOKI
  json: |
    {
      "title": "External Access Logs (Cloudflare Tunnel)",
      "uid": "envoy-external-access-logs",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "time": {"from": "now-6h", "to": "now"},
      "refresh": "1m",
      "tags": ["envoy", "cloudflare", "access-logs"],
      "templating": {
        "list": [
          {
            "name": "host",
            "label": "Host",
            "type": "query",
            "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
            "query": "label_values({gateway=\"envoy-external\"}, host)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": {"text": "All", "value": "$__all"},
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Status Class",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "fieldConfig": {"defaults": {"custom": {"stacking": {"mode": "normal"}}, "unit": "reqps"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "sum by (status_class) (count_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json response_code=\"response_code\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | label_format status_class=`{{ regexReplaceAll \"^([0-9])[0-9]{2}$\" .response_code \"$${1}xx\" }}` [$__auto]))",
              "legendFormat": "{{status_class}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Status Code Distribution",
          "type": "piechart",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "sum by (response_code) (count_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json response_code=\"response_code\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` [$__range]))",
              "legendFormat": "{{response_code}}",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency (p50 / p95 / p99)",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "fieldConfig": {"defaults": {"unit": "ms"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "quantile_over_time(0.50, {gateway=\"envoy-external\", host=~\"$host\"} | json duration=\"duration\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | drop downstream_remote_address | unwrap duration [$__auto])",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "quantile_over_time(0.95, {gateway=\"envoy-external\", host=~\"$host\"} | json duration=\"duration\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | drop downstream_remote_address | unwrap duration [$__auto])",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "quantile_over_time(0.99, {gateway=\"envoy-external\", host=~\"$host\"} | json duration=\"duration\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | drop downstream_remote_address | unwrap duration [$__auto])",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 4,
          "title": "Bandwidth",
          "type": "timeseries",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "sum(sum_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json bytes_sent=\"bytes_sent\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | unwrap bytes_sent [$__auto]))",
              "legendFormat": "sent"
            },
            {
              "refId": "B",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "sum(sum_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json bytes_received=\"bytes_received\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | unwrap bytes_received [$__auto]))",
              "legendFormat": "received"
            }
          ]
        },
        {
          "id": 5,
          "title": "Top Hosts",
          "type": "table",
          "gridPos": {"x": 0, "y": 16, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "topk(10, sum by (host) (count_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` [$__range])))",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "id": 6,
          "title": "Top Client IPs",
          "type": "table",
          "gridPos": {"x": 8, "y": 16, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "topk(10, sum by (client_ip, cf_ip_country) (count_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json downstream_remote_address=\"downstream_remote_address\", cf_ip_country=\"cf_ip_country\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | label_format client_ip=`{{ regexReplaceAll \":[0-9]+$\" .downstream_remote_address \"\" }}` [$__range])))",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "id": 7,
          "title": "Top User-Agents",
          "type": "table",
          "gridPos": {"x": 16, "y": 16, "w": 8, "h": 8},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "topk(10, sum by (user_agent) (count_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json user_agent=\"[\\\"user-agent\\\"]\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` [$__range])))",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "id": 8,
          "title": "Visitors by Country",
          "type": "geomap",
          "gridPos": {"x": 0, "y": 24, "w": 12, "h": 10},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "options": {
            "view": {"id": "zero", "lat": 0, "lon": 0, "zoom": 1},
            "layers": [
              {
                "type": "markers",
                "name": "Requests by country",
                "location": {"mode": "lookup", "lookup": "cf_ip_country", "gazetteer": "public/gazetteer/countries.json"},
                "config": {"size": {"field": "Value"}, "color": {"field": "Value"}}
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "sum by (cf_ip_country) (count_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json cf_ip_country=\"cf_ip_country\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | cf_ip_country != \"\" [$__range]))",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "id": 9,
          "title": "Top Countries",
          "type": "bargauge",
          "gridPos": {"x": 12, "y": 24, "w": 12, "h": 10},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "topk(15, sum by (cf_ip_country) (count_over_time({gateway=\"envoy-external\", host=~\"$host\"} | json cf_ip_country=\"cf_ip_country\", downstream_remote_address=\"downstream_remote_address\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | cf_ip_country != \"\" [$__range])))",
              "instant": true,
              "format": "table"
            }
          ]
        },
        {
          "id": 10,
          "title": "Live Access Logs",
          "type": "logs",
          "gridPos": {"x": 0, "y": 34, "w": 24, "h": 12},
          "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
          "options": {"showTime": true, "wrapLogMessage": true, "prettifyLogMessage": false, "enableLogDetails": true, "sortOrder": "Descending"},
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "loki", "uid": "$${DS_LOKI}"},
              "expr": "{gateway=\"envoy-external\", host=~\"$host\"} | json method=\"method\", response_code=\"response_code\", duration=\"duration\", downstream_remote_address=\"downstream_remote_address\", cf_ip_country=\"cf_ip_country\", user_agent=\"[\\\"user-agent\\\"]\" | __error__=\"\" | downstream_remote_address !~ `^(10\\.|192\\.168\\.|127\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.)` | line_format `{{.host}} {{.method}} {{.response_code}} {{.duration}}ms {{.downstream_remote_address}} ({{.cf_ip_country}}) \"{{.user_agent}}\"`"
            }
          ]
        }
      ]
    }
