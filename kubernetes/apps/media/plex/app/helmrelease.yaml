---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  chartRef:
    kind: OCIRepository
    name: plex
  interval: 1h
  values:
    controllers:
      plex:
        annotations:
          reloader.stakater.com/auto: "true"
          # pod: # Soft anti-affinity: prefer not to share node with other GPU apps
          # affinity:
          #   podAntiAffinity:
          #     preferredDuringSchedulingIgnoredDuringExecution:
          #       - weight: 100
          #         podAffinityTerm:
          #           labelSelector:
          #             matchLabels:
          #               app.kubernetes.io/name: immich
          #           topologyKey: kubernetes.io/hostname
        containers:
          app:
            env:
              PLEX_ADVERTISE_URL: https://plex.${SECRET_DOMAIN}:443,http://192.168.178.128:32400,http://plex.media.svc.cluster.local:32400
              PLEX_NO_AUTH_NETWORKS: 192.168.178.0/24,192.168.100.0/24
              TZ: Europe/Berlin
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            probes:
              liveness: &probes
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /identity
                    port: &port 32400
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              limits:
                memory: 14Gi
              requests:
                cpu: 100m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add: ["SYS_ADMIN"]
                drop: ["ALL"]
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    persistence:
      config:
        accessMode: ReadWriteOnce
        enabled: true
        size: 50G
        storageClass: local-hostpath
        type: persistentVolumeClaim
      media:
        globalMounts:
          - path: /media
            readOnly: true
        path: /media
        server: nas.internal
        type: nfs
      media2:
        globalMounts:
          - path: /data2
            readOnly: true
        path: /collection
        server: nas.internal
        type: nfs
      media3:
        globalMounts:
          - path: /media3
            subPath: media
            readOnly: true
        path: /mnt/user/data
        server: 192.168.178.140
        type: nfs
      tmp:
        type: emptyDir
      dri:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
    route:
      app:
        annotations:
          gethomepage.dev/description: Media streaming
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media Library
          gethomepage.dev/href: https://plex.${SECRET_DOMAIN}
          gethomepage.dev/icon: plex.svg
          gethomepage.dev/name: Plex
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_PLEX_API_KEY}}`}}"
          gethomepage.dev/widget.type: plex
          gethomepage.dev/widget.url: http://plex.media.svc.cluster.local:32400
          gatus.home-operations.com/endpoint: |-
            path: /identity
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - name: app
            backendRefs: &backendRefs
              - identifier: app
                port: *port
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier: &pipeline
                  set:
                    # Plex closes idle keep-alive connections after 20s unless this is set, so Envoy owns the pool
                    - name: X-Plex-Http-Pipeline
                      value: infinite
          - name: events
            backendRefs: *backendRefs
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier: *pipeline
            matches:
              - path:
                  type: PathPrefix
                  value: /:/eventsource
              - path:
                  type: PathPrefix
                  value: /:/websockets
          - matches:
              - path:
                  type: Exact
                  value: /
            filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /web/
                  statusCode: 302
          - backendRefs: *backendRefs
    service:
      app:
        annotations:
          lbipam.cilium.io/ips: 192.168.178.128
        externalTrafficPolicy: Local
        ports:
          http:
            port: *port
        type: LoadBalancer
