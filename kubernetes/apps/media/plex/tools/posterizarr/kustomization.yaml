---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
configMapGenerator:
  - name: posterizarr-overlay-files
    files:
      - ./resources/fonts/BebasNeue-Regular.ttf
      - ./resources/fonts/GoodHeadlinePro-CondMedium.ttf
  - name: posterizarr-configmap
    files:
      - config.json.template=./config/config.json.template
      - init-config.sh=./config/init-config.sh
generatorOptions:
  disableNameSuffixHash: true
