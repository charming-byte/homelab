---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: kometa-configmap
    files:
      - ./configs/config.yml
      - ./configs/filme.yml
      - ./configs/serien.yml
