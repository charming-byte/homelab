---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &secret pgadmin-secret-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *secret
    template:
      engineVersion: v2
      data:
        config_local.py: |-
          import os
          AUTHENTICATION_SOURCES = ['oauth2', 'internal']
          MASTER_PASSWORD_REQUIRED = False
          OAUTH2_CONFIG = [{
              'OAUTH2_NAME': 'authentik',
              'OAUTH2_DISPLAY_NAME': 'Authentik',
              'OAUTH2_CLIENT_ID': '{{ .OAUTH2_CLIENT_ID | trim }}',
              'OAUTH2_CLIENT_SECRET': '{{ .OAUTH2_CLIENT_SECRET | trim }}',
              'OAUTH2_SERVER_METADATA_URL': '{{ .OAUTH2_SERVER_METADATA_URL | trim }}',
              'OAUTH2_SCOPE': 'openid email profile',
              'OAUTH2_BUTTON_COLOR': '#fd4b2d',
              'OAUTH2_AUTO_CREATE_USER': True,
              'OAUTH2_ICON': 'lock'
          }]
        pgpass: |
          postgres18.dbms.svc.cluster.local:5432:postgres:postgres:{{ .POSTGRES_SUPER_PASS | trim }}
  dataFrom:
    - extract:
        key: pgadmin
    - extract:
        key: postgres
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgadmin
  namespace: dbms
spec:
  dataFrom:
    - extract:
        key: pgadmin
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pgadmin-secret
    template:
      data:
        PGADMIN_DEFAULT_EMAIL: "{{ .PGADMIN_EMAIL }}"
        PGADMIN_DEFAULT_PASSWORD: "{{ .PGADMIN_PASSWORD }}"
        email: "{{ .PGADMIN_EMAIL }}"
        password: "{{ .PGADMIN_PASSWORD }}"
