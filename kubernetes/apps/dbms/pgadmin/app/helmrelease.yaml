---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
spec:
  chartRef:
    kind: OCIRepository
    name: pgadmin
  interval: 1h
  values:
    controllers:
      pgadmin:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              TZ: Europe/Berlin
              PGPASS_FILE: /pgadmin4/pgpass
            envFrom: &envFrom
              - secretRef:
                  name: pgadmin-secret
            image: &image
              repository: docker.io/dpage/pgadmin4
              tag: 9.19@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 15m
                memory: 300Mi
        initContainers:
          # Both logins (internal + oauth2) share the storage dir of the same username,
          # so one .pgpass serves both. Servers are loaded per user (not shared),
          # otherwise pgAdmin ignores the PassFile for the non-owner.
          init-servers:
            image: *image
            envFrom: *envFrom
            command:
              - /bin/sh
              - -c
              - |
                storage="/var/lib/pgadmin/storage/$(echo "$${PGADMIN_DEFAULT_EMAIL}" | sed 's/@/_/g')"
                mkdir -p "$${storage}"
                install -m 600 /pgadmin4/pgpass "$${storage}/.pgpass"
                if [ ! -f /var/lib/pgadmin/pgadmin4.db ]; then
                  echo "pgAdmin not initialised yet, entrypoint will load servers"
                  exit 0
                fi
                cd /pgadmin4
                for source in internal oauth2; do
                  /venv/bin/python3 setup.py load-servers /pgadmin4/servers.json \
                    --user "$${PGADMIN_DEFAULT_EMAIL}" --auth-source "$${source}" --replace \
                    || echo "Skipping servers for $${source} user"
                done
        pod:
          securityContext:
            fsGroup: 5050
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 5050
            runAsUser: 5050
    configMaps:
      servers:
        data:
          servers.json: |
            {
              "Servers": {
                "1": {
                  "Name": "postgres18",
                  "Group": "Servers",
                  "Host": "postgres18.dbms.svc.cluster.local",
                  "Port": 5432,
                  "MaintenanceDB": "postgres",
                  "Username": "postgres",
                  "PassFile": "/.pgpass",
                  "Shared": false,
                  "SSLMode": "prefer",
                  "SSLCompression": 0,
                  "Timeout": 10,
                  "UseSSHTunnel": 0,
                  "TunnelPort": "22",
                  "TunnelAuthentication": 0
                },
                "2": {
                  "Name": "immich",
                  "Group": "Servers",
                  "Host": "postgres18-vector-rw.dbms.svc.cluster.local",
                  "Port": 5432,
                  "MaintenanceDB": "postgres",
                  "Username": "postgres",
                  "PassFile": "/.pgpass",
                  "Shared": false,
                  "SSLMode": "prefer",
                  "SSLCompression": 0,
                  "Timeout": 10,
                  "UseSSHTunnel": 0,
                  "TunnelPort": "22",
                  "TunnelAuthentication": 0
                }
              }
            }
    persistence:
      data:
        enabled: true
        existingClaim: pgadmin-v2
        advancedMounts:
          pgadmin:
            app:
              - path: /var/lib/pgadmin
            init-servers:
              - path: /var/lib/pgadmin
      backups:
        enabled: true
        globalMounts:
          - path: /pgadmin4/backups
            subPath: backups/postgres
        path: /nas
        server: nas.internal
        type: nfs
      oauth:
        enabled: true
        type: secret
        name: pgadmin-secret-auth
        advancedMounts:
          pgadmin:
            app: &oauthMounts
              - path: /pgadmin4/config_local.py
                subPath: config_local.py
              - path: /pgadmin4/pgpass
                subPath: pgpass
            init-servers: *oauthMounts
      servers:
        type: configMap
        name: pgadmin
        globalMounts:
          - path: /pgadmin4/servers.json
            subPath: servers.json
    route:
      app:
        annotations:
          gethomepage.dev/description: PostgreSQL administration
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Platform & Network
          gethomepage.dev/icon: pgadmin.png
          gethomepage.dev/name: PGAdmin
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    service:
      app:
        controller: pgadmin
        ports:
          http:
            port: 80
