---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
spec:
  chartRef:
    kind: OCIRepository
    name: pgadmin
  interval: 1h
  values:
    controllers:
      pgadmin:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              TZ: Europe/Berlin
              PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
            envFrom:
              - secretRef:
                  name: pgadmin-secret
            image:
              repository: docker.io/dpage/pgadmin4
              tag: 9.17@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 15m
                memory: 300Mi
        pod:
          securityContext:
            fsGroup: 5050
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 5050
            runAsUser: 5050
    configMaps:
      servers:
        data:
          servers.json: |
            {
              "Servers": {
                "1": {
                  "Name": "postgres18",
                  "Group": "Servers",
                  "Host": "postgres18.dbms.svc.cluster.local",
                  "Port": 5432,
                  "MaintenanceDB": "postgres",
                  "Username": "postgres",
                  "PassFile": "/pgadmin4/pgpass",
                  "Shared": true,
                  "SharedUsername": "postgres",
                  "SSLMode": "prefer",
                  "SSLCompression": 0,
                  "Timeout": 10,
                  "UseSSHTunnel": 0,
                  "TunnelPort": "22",
                  "TunnelAuthentication": 0
                },
                "2": {
                  "Name": "immich",
                  "Group": "Servers",
                  "Host": "postgres18-vector-rw.dbms.svc.cluster.local",
                  "Port": 5432,
                  "MaintenanceDB": "postgres",
                  "Username": "postgres",
                  "PassFile": "/pgadmin4/pgpass",
                  "Shared": true,
                  "SharedUsername": "postgres",
                  "SSLMode": "prefer",
                  "SSLCompression": 0,
                  "Timeout": 10,
                  "UseSSHTunnel": 0,
                  "TunnelPort": "22",
                  "TunnelAuthentication": 0
                }
              }
            }
    persistence:
      data:
        enabled: true
        existingClaim: pgadmin-v2
        advancedMounts:
          pgadmin:
            app:
              - path: /var/lib/pgadmin
      backups:
        enabled: true
        globalMounts:
          - path: /pgadmin4/backups
            subPath: backups/postgres
        path: /nas
        server: nas.internal
        type: nfs
      oauth:
        enabled: true
        type: secret
        name: pgadmin-secret-auth
        advancedMounts:
          pgadmin:
            app:
              - path: /pgadmin4/config_local.py
                subPath: config_local.py
              - path: /pgadmin4/pgpass
                subPath: pgpass
      servers:
        type: configMap
        name: pgadmin
        globalMounts:
          - path: /pgadmin4/servers.json
            subPath: servers.json
    route:
      app:
        annotations:
          gethomepage.dev/description: PostgreSQL Tools
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/icon: pgadmin.png
          gethomepage.dev/name: PGAdmin
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
    service:
      app:
        controller: pgadmin
        ports:
          http:
            port: 80
