---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nas-resticprofile
spec:
  dataFrom:
    - extract:
        key: resticprofile
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: nas-resticprofile-secret
    template:
      data:
        AWS_DEFAULT_REGION: "{{ .RESTICPROFILE_S3_REGION }}"
        AWS_ACCESS_KEY_ID: "{{ .RESTICPROFILE_S3_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .RESTICPROFILE_S3_SECRET_ACCESS_KEY }}"
        backup-key: "{{ .RESTICPROFILE_BACKUP_KEY }}"
        profiles.yaml: |
          version: "1"

          global:
            scheduler: crond

          default:
            repository: s3:{{ .RESTICPROFILE_S3_ENDPOINT_URL }}
            password-file: /resticprofile/backup-key

          nas:
            inherit: default
            initialize: false
            prometheus-push: "https://pushgateway.${SECRET_DOMAIN}"
            prometheus-labels: [{ host: nas }]

            backup:
              extended-status: true
              source:
                - /nas

              schedule: "weekly"
              schedule-permission: system
              schedule-lock-wait: 1h

              send-before:
                - method: HEAD
                  url: {{ .RESTICPROFILE_BACKUP_HC_PING_URL }}/start
              send-after:
                - method: HEAD
                  url: {{ .RESTICPROFILE_BACKUP_HC_PING_URL }}
              send-after-fail:
                - method: HEAD
                  url: {{ .RESTICPROFILE_BACKUP_HC_PING_URL }}/fail

            forget:
              prune: true
              keep-last: 3
              keep-weekly: 6

            check:
              read-data: true

              schedule: "monthly"
              schedule-permission: user

              send-before:
                - method: HEAD
                  url: {{ .RESTICPROFILE_CHECK_HC_PING_URL }}/start
              send-after:
                - method: HEAD
                  url: {{ .RESTICPROFILE_CHECK_HC_PING_URL }}
              send-after-fail:
                - method: HEAD
                  url: {{ .RESTICPROFILE_CHECK_HC_PING_URL }}/fail
