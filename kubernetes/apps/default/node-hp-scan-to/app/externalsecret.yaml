---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-hp-scan-to
spec:
  dataFrom:
    - extract:
        key: node-hp-scan-to
    - extract:
        key: paperless-ngx
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: node-hp-scan-to-secret
    template:
      data:
        IP: "{{ .HP_SCAN_TO_PRINTER_IP }}"
        PAPERLESS_TOKEN: "{{ .PAPERLESS_HP_SCAN_TO_TOKEN }}"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: node-hp-scan-to-registry
spec:
  dataFrom:
    - extract:
        key: node-hp-scan-to
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: node-hp-scan-to-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .GHCR_USERNAME .GHCR_TOKEN | b64enc }}"}}}
