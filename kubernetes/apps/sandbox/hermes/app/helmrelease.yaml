---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        pod:
          labels:
            # Selected by the sandbox-egress-deny CiliumClusterwideNetworkPolicy
            security.homelab/sandbox: "true"
          runtimeClassName: kata
        initContainers:
          init-home:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
            # s6-overlay refuses a /run it does not own (the emptyDir root
            # is root:10000 with mode 2777), so /run is a subPath owned by 10000
            command: ["/bin/sh", "-c"]
            args:
              - mkdir -p /pvc/home /runvol/run && chmod 0755 /runvol/run && chmod g-s /runvol/run
            resources:
              limits:
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
          init-config:
            dependsOn: init-home
            image: *image
            command: ["/bin/sh", "-c"]
            # stage2-hook skips the config migration for non-root starts
            # (it calls s6-setuidgid unconditionally), so run it here
            args:
              - |
                cp /config/config.yaml /opt/data/config.yaml
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext: *securityContext
        containers:
          # s6-overlay (PID 1) supervises gateway and dashboard in one
          # container: the dashboard chat attaches to the gateway through a
          # Unix socket in HERMES_HOME, which does not work across the
          # per-container virtiofs mounts of a Kata pod
          app:
            image: *image
            args: ["gateway", "run"]
            env:
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &apiPort 8642
              FIRECRAWL_API_URL: http://firecrawl.ai.svc.cluster.local:3002
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_OIDC_CLIENT_ID: hermes-dashboard
              HERMES_DASHBOARD_OIDC_ISSUER: https://sso.${SECRET_DOMAIN}/application/o/hermes/
              HERMES_DASHBOARD_PORT: &dashboardPort 9119
              HERMES_DASHBOARD_PUBLIC_URL: https://web-hermes.${SECRET_DOMAIN}
              # Keep Telegram name resolution on CoreDNS instead of DoH
              HERMES_TELEGRAM_DISABLE_FALLBACK_IPS: "true"
              TZ: Europe/Berlin
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              liveness:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api/status
                    port: *dashboardPort
                  periodSeconds: 30
                  timeoutSeconds: 5
              startup:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 30
                  httpGet:
                    path: /health
                    port: *apiPort
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              limits:
                cpu: "2"
                memory: 4Gi
              requests:
                cpu: 250m
                memory: 1280Mi
            securityContext: *securityContext
      backup:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          schedule: "30 3 * * *"
          successfulJobsHistory: 2
        initContainers:
          archive:
            image: *image
            # SQLite backup() API, safe while the gateway is running. Runs as
            # the data owner (10000) and never touches the NAS.
            command: ["/bin/sh", "-c"]
            args:
              - |
                hermes backup -o "/archive/hermes-backup-$(date +%Y%m%d-%H%M%S).zip" -k 0
                chmod 0644 /archive/hermes-backup-*.zip
            env:
              HOME: /tmp
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext: *securityContext
        containers:
          app:
            image: *image
            # Writes as the NAS anonymous user (1000), keeps the newest 7
            # archives; restic copies the directory offsite
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                cp /archive/hermes-backup-*.zip /backups/
                ls -1t /backups/hermes-backup-*.zip | tail -n +8 | xargs -r rm -f
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              <<: *securityContext
              runAsGroup: 1000
              runAsUser: 1000
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
    persistence:
      archive:
        advancedMounts:
          backup:
            archive:
              - path: /archive
            app:
              - path: /archive
                readOnly: true
        type: emptyDir
      backups:
        advancedMounts:
          backup:
            app:
              - path: /backups
                subPath: backups/hermes
        existingClaim: hermes-backup
      config:
        advancedMounts:
          hermes:
            init-config:
              - path: /config
                readOnly: true
        name: hermes-configmap
        type: configMap
      data:
        accessMode: ReadWriteOnce
        advancedMounts:
          hermes:
            init-home:
              - path: /pvc
            init-config:
              - path: /opt/data
                subPath: home
            app:
              - path: /opt/data
                subPath: home
          backup:
            archive:
              - path: /opt/data
                subPath: home
        size: 10Gi
        storageClass: local-hostpath
        suffix: data
      run:
        advancedMounts:
          hermes:
            init-home:
              - path: /runvol
            app:
              - path: /run
                subPath: run
        type: emptyDir
      shm:
        advancedMounts:
          hermes:
            app:
              - path: /dev/shm
        medium: Memory
        sizeLimit: 1Gi
        type: emptyDir
      tmp:
        globalMounts:
          - path: /tmp
        type: emptyDir
    route:
      hermes:
        annotations:
          gethomepage.dev/description: Self-hosted AI agent
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Development & AI
          gethomepage.dev/icon: mdi-robot
          gethomepage.dev/name: Hermes
        hostnames: ["web-hermes.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *dashboardPort
      api:
        hostnames: ["api-hermes.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *apiPort
    service:
      app:
        controller: hermes
        ports:
          api:
            port: *apiPort
          web:
            port: *dashboardPort
