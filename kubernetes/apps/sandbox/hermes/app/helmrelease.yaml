---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      backup:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          failedJobsHistory: 2
          schedule: "30 3 * * *"
          successfulJobsHistory: 2
        initContainers:
          archive:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
            command: ["/bin/sh", "-c"]
            args:
              - |
                hermes backup -o "/archive/hermes-backup-$(date +%Y%m%d-%H%M%S).zip" -k 0
                chmod 0644 /archive/hermes-backup-*.zip
            env:
              HOME: /tmp
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 50m
                memory: 256Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
        containers:
          app:
            image: *image
            # UID 1000 is the NAS anonymous user
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                cp /archive/hermes-backup-*.zip /backups/
                ls -1t /backups/hermes-backup-*.zip | tail -n +8 | xargs -r rm -f
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              <<: *securityContext
              runAsGroup: 1000
              runAsUser: 1000
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10000
        runAsNonRoot: true
        runAsUser: 10000
        seccompProfile:
          type: RuntimeDefault
    persistence:
      archive:
        advancedMounts:
          backup:
            archive:
              - path: /archive
            app:
              - path: /archive
                readOnly: true
        type: emptyDir
      backups:
        advancedMounts:
          backup:
            app:
              - path: /backups
                subPath: backups/hermes
        existingClaim: hermes-backup
      data:
        accessMode: ReadWriteOnce
        advancedMounts:
          backup:
            archive:
              - path: /opt/data
                subPath: home
        retain: true
        size: 10Gi
        storageClass: local-hostpath
        suffix: data
      tmp:
        globalMounts:
          - path: /tmp
        type: emptyDir
