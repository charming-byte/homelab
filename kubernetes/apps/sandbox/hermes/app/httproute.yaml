---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes
  annotations:
    gethomepage.dev/description: Self-hosted AI agent
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Development & AI
    gethomepage.dev/icon: mdi-robot
    gethomepage.dev/name: Hermes
spec:
  hostnames: ["web-hermes.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hermes
          port: 9119
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-api
spec:
  hostnames: ["api-hermes.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hermes
          port: 8642
