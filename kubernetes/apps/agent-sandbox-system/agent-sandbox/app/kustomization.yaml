---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./rbac.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v0.4.3/k8s/crds/agents.x-k8s.io_sandboxes.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v0.4.3/k8s/crds/extensions.agents.x-k8s.io_sandboxclaims.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v0.4.3/k8s/crds/extensions.agents.x-k8s.io_sandboxtemplates.yaml
  - https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v0.4.3/k8s/crds/extensions.agents.x-k8s.io_sandboxwarmpools.yaml
patches:
  - # Keep CRDs (and with them all Sandbox resources) if they are ever removed from this kustomization
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: _
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
    target:
      group: apiextensions.k8s.io
      kind: CustomResourceDefinition
