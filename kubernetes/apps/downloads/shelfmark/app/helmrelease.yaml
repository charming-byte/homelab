---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  chartRef:
    kind: OCIRepository
    name: shelfmark
  install:
    remediation:
      retries: 3
  interval: 1h
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      shelfmark:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            args:
              - --access-logfile=-
              - --error-logfile=-
              - --worker-class=geventwebsocket.gunicorn.workers.GeventWebSocketWorker
              - --workers=1
              - -t
              - "300"
              - -b
              - 0.0.0.0:8084
              - shelfmark.main:app
            command:
              - gunicorn
            env:
              AUDIOBOOK_WEBHOOK_URL: http://webhook.downloads.svc.cluster.local:8080/hooks/request-audiobook-m4b-conversion
              AUTH_METHOD: oidc
              # Post-download hook: notify the audiobook-m4b webhook, which
              # creates a Job that converts non-m4b audiobooks to a tagged m4b.
              CUSTOM_SCRIPT: /scripts/notify-webhook.py
              CUSTOM_SCRIPT_JSON_PAYLOAD: "true"
              CUSTOM_SCRIPT_PATH_MODE: absolute
              HIDE_LOCAL_AUTH: "true"
              INGEST_DIR: /media/media/books/ingest
              OIDC_ADMIN_GROUP: shelfmark Admins
              OIDC_AUTO_PROVISION: "true"
              OIDC_AUTO_REDIRECT: "true"
              OIDC_CLIENT_ID: shelfmark
              OIDC_DISCOVERY_URL: https://sso.${SECRET_DOMAIN}/application/o/shelfmark/.well-known/openid-configuration
              PYTHONDONTWRITEBYTECODE: "1"
              TZ: Europe/Berlin
            envFrom:
              - secretRef:
                  name: shelfmark-secret
            image:
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.3.15@sha256:9602290324993c801b319d3166b202b96bd9039af2416f0916dae03a5bdca815
            probes:
              liveness:
                enabled: true
                spec:
                  failureThreshold: 5
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                custom: true
                enabled: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /api/health
                    port: 8084
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              limits:
                memory: 512Mi
              requests:
                cpu: 10m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
    persistence:
      config:
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /config
        size: 2Gi
        storageClass: local-hostpath
      media:
        globalMounts:
          - path: /data
        path: /data
        server: scarif.nas.${SECRET_DOMAIN}
        type: nfs
      scripts:
        defaultMode: 0755
        globalMounts:
          - path: /scripts
            readOnly: true
        name: shelfmark-scripts
        type: configMap
      tmpfs:
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /var/log
            subPath: var-log
        sizeLimit: 1Gi
        type: emptyDir
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/icon: shelfmark.png
          gethomepage.dev/name: Shelfmark
        hostnames:
          - shelfmark.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - name: shelfmark
                port: 8084
    service:
      app:
        controller: shelfmark
        ports:
          http:
            port: 8084
