# beets config for the one-shot audiobook-m4b conversion Job.
# Takes the single merged .m4b, matches it against the /work/merged/<book>/
# metadata.yml that asin_lookup wrote (beets-audible reads it and skips the
# Audible lookup), writes book-level tags + desc.txt / reader.txt sidecars and
# moves it into the audiobook library. Chapter markers and cover art are embedded
# by the merge step, not by beets. No copyartifacts plugin - its sorted_walk call
# is str/bytes-incompatible with this beets version and crashes manipulate_files;
# the merge + beets steps copy cover.jpg / metadata.yml themselves.
plugins: audible edit fromfilename scrub

directory: /media/media/audiobooks/library
library: /config/library.db

# Non-interactive import: never prompt; with no metadata.yml / no confident
# match, keep the tags the merge step embedded (quiet_fallback: asis).
import:
  write: yes
  copy: no
  move: yes
  timid: no
  quiet: yes
  quiet_fallback: asis
  resume: no
  group_albums: no

match:
  strong_rec_thresh: 0.10

musicbrainz:
  enabled: no

paths:
  "albumtype:audiobook series_name::.+": $albumartist/%ifdef{series_name}/$album%aunique{}/$album
  "albumtype:audiobook": $albumartist/$album%aunique{}/$album
  default: $albumartist/$album%aunique{}/$album

audible:
  region: de
  match_chapters: false
  data_source_mismatch_penalty: 0.0
  fetch_art: true
  include_narrator_in_artists: false
  write_description_file: true
  write_reader_file: true

scrub:
  auto: yes
