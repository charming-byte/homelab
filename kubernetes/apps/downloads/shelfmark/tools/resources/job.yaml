---
# Rendered and created at runtime by create-job.sh. Placeholders __SUFFIX__,
# __SOURCE_PATH_B64__, __TITLE_B64__, __AUTHOR_B64__ are substituted (base64,
# sed-safe charset). This file is NOT applied by Flux - it is the Job template.
apiVersion: batch/v1
kind: Job
metadata:
  name: audiobook-m4b-__SUFFIX__
  namespace: downloads
  labels:
    app.kubernetes.io/name: audiobook-m4b
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiobook-m4b
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: asin-lookup
          image: docker.io/library/python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command: ["python3", "/scripts/asin_lookup.py"]
          env:
            - { name: SOURCE_PATH_B64, value: "__SOURCE_PATH_B64__" }
            - { name: TITLE_B64, value: "__TITLE_B64__" }
            - { name: AUTHOR_B64, value: "__AUTHOR_B64__" }
            - { name: ASIN_OUT, value: "/work/asin" }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: media, mountPath: /media, readOnly: true }
            - { name: scripts, mountPath: /scripts, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
        - name: merge
          image: ghcr.io/djdembeck/m4b-merge:1.0.0@sha256:cc61635ca687ed12eb57f7d733b1e47de1427f7f3b4b8d17a8f42b950c2b867b
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              # One [CHAPTER] per source file, offsets from real durations.
              # m4b-merge only chapterizes when its Audnex lookup succeeds, and
              # its client sends no region so any non-us ASIN 404s - without this
              # a multi-file source would merge into one chapterless blob.
              build_file_chapters() {
                _list=/work/tmp/flist
                find "$1" -type f \( -iname '*.mp3' -o -iname '*.m4a' \
                  -o -iname '*.m4b' -o -iname '*.flac' -o -iname '*.ogg' \
                  -o -iname '*.opus' -o -iname '*.aac' -o -iname '*.wav' \
                  -o -iname '*.wma' \) | sort -V > "$_list"
                [ -s "$_list" ] || return 1
                : > /work/tmp/durs
                while IFS= read -r _f; do
                  printf '%s\t%s\n' \
                    "$(ffprobe -v error -show_entries format=duration \
                        -of default=nw=1:nk=1 "$_f" 2>/dev/null)" \
                    "$(basename "$_f")" >> /work/tmp/durs
                done < "$_list"
                awk -F'\t' '
                  BEGIN { print ";FFMETADATA1" }
                  {
                    start = off; off += $1 * 1000
                    t = $2; sub(/\.[^.]+$/, "", t); gsub(/[=;#\\]/, " ", t)
                    printf "\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=%d\nEND=%d\ntitle=%s\n", \
                      start, off, t
                  }
                ' /work/tmp/durs > "$2"
              }

              chapter_count() {
                ffprobe -v error -show_entries chapter=start_time -of csv=p=0 \
                  "$1" 2>/dev/null | grep -c . || true
              }

              SRC="$(printf '%s' "$SOURCE_PATH_B64" | base64 -d)"
              ASIN=""; REGION=""
              if [ -s /work/asin ]; then
                ASIN="$(cut -d' ' -f1 /work/asin)"
                REGION="$(cut -d' ' -f2 /work/asin)"
              fi
              mkdir -p /work/merged /work/tmp

              # m4b-merge can only resolve us-region ASINs; asin_lookup has
              # already written the correct-region chapters to
              # /work/chapters.ffmeta for every other case.
              MERGE_ASIN=""
              [ "$REGION" = "us" ] && MERGE_ASIN="$ASIN"

              echo "merging: $SRC (asin=${ASIN:-none} region=${REGION:-none} m4b-merge-a=${MERGE_ASIN:-none})"
              m4b-merge -i "$SRC" ${MERGE_ASIN:+-a "$MERGE_ASIN"} \
                -o /work/merged -p "{title}" --num-cpus 4

              BOOK="$(find /work/merged -name '*.m4b' -type f | head -n1)"
              [ -n "$BOOK" ] || { echo "m4b-merge produced no .m4b" >&2; exit 1; }

              # beets imports a directory as an album; m4b-merge writes the .m4b
              # straight into -o when no metadata is applied (no us ASIN), so nest
              # it under its own folder: /work/merged/<title>/<title>.m4b
              if [ "$(dirname "$BOOK")" = "/work/merged" ]; then
                BASE="$(basename "$BOOK" .m4b)"
                mkdir -p "/work/merged/$BASE"
                mv "$BOOK" "/work/merged/$BASE/$BASE.m4b"
                BOOK="/work/merged/$BASE/$BASE.m4b"
              fi

              if [ "$(chapter_count "$BOOK")" -lt 2 ]; then
                NFILES="$(find "$SRC" -type f \( -iname '*.mp3' -o -iname '*.m4a' \
                  -o -iname '*.m4b' -o -iname '*.flac' -o -iname '*.ogg' \
                  -o -iname '*.opus' -o -iname '*.aac' -o -iname '*.wav' \
                  -o -iname '*.wma' \) | grep -c . || true)"
                META=""
                if [ "${NFILES:-0}" -ge 2 ]; then
                  echo "deriving chapters from $NFILES source files"
                  build_file_chapters "$SRC" /work/tmp/chapters.ffmeta \
                    && META=/work/tmp/chapters.ffmeta
                elif [ -s /work/chapters.ffmeta ]; then
                  echo "using Audnex chapters (region=${REGION:-?})"
                  META=/work/chapters.ffmeta
                fi
                if [ -n "$META" ] && [ -s "$META" ]; then
                  ffmpeg -nostdin -v error -i "$BOOK" -i "$META" \
                    -map 0 -map_metadata 0 -map_chapters 1 -c copy \
                    -f mp4 "$BOOK.chapters.m4b"
                  mv "$BOOK.chapters.m4b" "$BOOK"
                  echo "embedded $(chapter_count "$BOOK") chapters"
                fi
              fi
          env:
            - { name: SOURCE_PATH_B64, value: "__SOURCE_PATH_B64__" }
            - { name: HOME, value: "/work" }
            - { name: TMPDIR, value: "/work/tmp" }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: media, mountPath: /media }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "4", memory: 1Gi }
      containers:
        - name: beets
          image: ghcr.io/neopterygii/beets-audible:latest@sha256:583c2839a5cbe27a8f215e8f157a65f3c924f88c327001d0cdd4acae55fabef0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export HOME=/config BEETSDIR=/config
              ASIN=""
              [ -s /work/asin ] && ASIN="$(cut -d' ' -f1 /work/asin)"
              BOOK="$(find /work/merged -mindepth 1 -maxdepth 1 -type d | head -n1)"
              if [ -z "$BOOK" ]; then
                echo "no merged book directory in /work/merged - nothing to import"
                exit 0
              fi
              echo "importing: $BOOK  (asin=${ASIN:-none})"
              if ! /lsiopy/bin/beet -c /cfg/config.yaml import -q ${ASIN:+--search-id "$ASIN"} "$BOOK"; then
                echo "beet import failed - moving merged output to _unsorted"
                mkdir -p /media/media/audiobooks/library/_unsorted
                mv "$BOOK"/* /media/media/audiobooks/library/_unsorted/
              fi
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: media, mountPath: /media }
            - { name: beets-config, mountPath: /cfg, readOnly: true }
            - { name: beets-home, mountPath: /config }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        - name: work
          emptyDir: { sizeLimit: 12Gi }
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        - name: beets-home
          emptyDir: {}
        - name: media
          nfs:
            server: nas.internal
            path: /media-root
        - name: scripts
          configMap:
            name: audiobook-m4b-scripts
            defaultMode: 0755
        - name: beets-config
          configMap:
            name: audiobook-m4b-beets
