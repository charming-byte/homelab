---
# Rendered and created at runtime by create-job.sh. Placeholders __SUFFIX__,
# __SOURCE_PATH_B64__, __TITLE_B64__, __AUTHOR_B64__ are substituted (base64,
# sed-safe charset). This file is NOT applied by Flux - it is the Job template.
apiVersion: batch/v1
kind: Job
metadata:
  name: audiobook-m4b-__SUFFIX__
  namespace: downloads
  labels:
    app.kubernetes.io/name: audiobook-m4b
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 18000
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiobook-m4b
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: asin-lookup
          image: docker.io/library/python:3.14-alpine@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command: ["python3", "/scripts/asin_lookup.py"]
          env:
            - { name: SOURCE_PATH_B64, value: "__SOURCE_PATH_B64__" }
            - { name: TITLE_B64, value: "__TITLE_B64__" }
            - { name: AUTHOR_B64, value: "__AUTHOR_B64__" }
            - { name: ASIN_OUT, value: "/work/asin" }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: media, mountPath: /media, readOnly: true }
            - { name: scripts, mountPath: /scripts, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
        - name: merge
          image: ghcr.io/djdembeck/m4b-merge:1.0.0@sha256:cc61635ca687ed12eb57f7d733b1e47de1427f7f3b4b8d17a8f42b950c2b867b
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              # One [CHAPTER] per source file, offsets from real durations. Used
              # only as a fallback: m4b-merge is never handed an ASIN (its Audnex
              # client sends no region and 404s on non-us books), and Audnex
              # chapters may not line up with a different / abridged edition.
              build_file_chapters() {
                _list=/work/tmp/flist
                find "$1" -type f \( -iname '*.mp3' -o -iname '*.m4a' \
                  -o -iname '*.m4b' -o -iname '*.flac' -o -iname '*.ogg' \
                  -o -iname '*.opus' -o -iname '*.aac' -o -iname '*.wav' \
                  -o -iname '*.wma' \) | sort -V > "$_list"
                [ -s "$_list" ] || return 1
                : > /work/tmp/durs
                while IFS= read -r _f; do
                  printf '%s\t%s\n' \
                    "$(ffprobe -v error -show_entries format=duration \
                        -of default=nw=1:nk=1 "$_f" 2>/dev/null)" \
                    "$(basename "$_f")" >> /work/tmp/durs
                done < "$_list"
                awk -F'\t' '
                  BEGIN { print ";FFMETADATA1" }
                  {
                    start = off; off += $1 * 1000
                    t = $2; sub(/\.[^.]+$/, "", t); gsub(/[=;#\\]/, " ", t)
                    printf "\n[CHAPTER]\nTIMEBASE=1/1000\nSTART=%d\nEND=%d\ntitle=%s\n", \
                      start, off, t
                  }
                ' /work/tmp/durs > "$2"
              }

              chapter_count() {
                ffprobe -v error -show_entries chapter=start_time -of csv=p=0 \
                  "$1" 2>/dev/null | grep -c . || true
              }

              # Last END= offset (ms) in an ffmetadata chapter file.
              ffmeta_span() { awk -F= '/^END=/ { v = $2 } END { print v + 0 }' "$1"; }

              file_duration_ms() {
                _d="$(ffprobe -v error -show_entries format=duration \
                  -of default=nw=1:nk=1 "$1" 2>/dev/null || true)"
                awk -v d="$_d" 'BEGIN { printf "%d", d * 1000 }'
              }

              SRC="$(printf '%s' "$SOURCE_PATH_B64" | base64 -d)"
              TITLE="$(printf '%s' "${TITLE_B64:-}" | base64 -d 2>/dev/null || true)"
              mkdir -p /work/merged /work/tmp

              # m4b-merge only concatenates / transcodes here; all tagging, cover
              # and chapters come from asin_lookup -> Audnex (/work/{metadata.yml,
              # chapters.ffmeta,tags.ffmeta,cover.jpg}).
              echo "merging: $SRC"
              m4b-merge -i "$SRC" -o /work/merged -p "{title}" --num-cpus 4

              BOOK="$(find /work/merged -name '*.m4b' -type f | head -n1)"
              [ -n "$BOOK" ] || { echo "m4b-merge produced no .m4b" >&2; exit 1; }

              # beets imports a directory as an album. Nest the loose .m4b under
              # its own folder, named from the real Audnex title when we have it,
              # else the Shelfmark title, else m4b-merge's guess.
              FOLDER=""
              [ -s /work/metadata.yml ] && FOLDER="$(sed -n 's/^title: "\(.*\)"$/\1/p' /work/metadata.yml | head -n1)"
              [ -z "$FOLDER" ] && FOLDER="$TITLE"
              [ -z "$FOLDER" ] && FOLDER="$(basename "$BOOK" .m4b)"
              FOLDER="$(printf '%s' "$FOLDER" | tr '/\\\n\r\t' '     ' | sed 's/  */ /g; s/^ *//; s/ *$//')"
              [ -n "$FOLDER" ] || FOLDER="audiobook"
              DEST="/work/merged/$FOLDER"
              if [ "$(dirname "$BOOK")" = "/work/merged" ]; then
                mkdir -p "$DEST"
                mv "$BOOK" "$DEST/$FOLDER.m4b"
                BOOK="$DEST/$FOLDER.m4b"
              else
                DEST="$(dirname "$BOOK")"
              fi

              # Choose a chapter source: prefer Audnex (region-correct titles),
              # fall back to source-file boundaries when Audnex chapters are
              # missing or their total span disagrees with the merged file by
              # more than 10% (different / abridged edition).
              CH=""
              DUR_MS="$(file_duration_ms "$BOOK")"
              if [ -s /work/chapters.ffmeta ]; then
                SPAN="$(ffmeta_span /work/chapters.ffmeta)"
                if [ "${DUR_MS:-0}" -gt 0 ] && [ "${SPAN:-0}" -gt 0 ] \
                  && [ "$SPAN" -ge $((DUR_MS * 90 / 100)) ] \
                  && [ "$SPAN" -le $((DUR_MS * 110 / 100)) ]; then
                  CH=/work/chapters.ffmeta
                  echo "chapters: Audnex (span ${SPAN}ms vs file ${DUR_MS}ms)"
                else
                  echo "chapters: Audnex span ${SPAN:-0}ms off from file ${DUR_MS}ms - trying source files"
                fi
              fi
              if [ -z "$CH" ]; then
                NFILES="$(find "$SRC" -type f \( -iname '*.mp3' -o -iname '*.m4a' \
                  -o -iname '*.m4b' -o -iname '*.flac' -o -iname '*.ogg' \
                  -o -iname '*.opus' -o -iname '*.aac' -o -iname '*.wav' \
                  -o -iname '*.wma' \) | grep -c . || true)"
                if [ "${NFILES:-0}" -ge 2 ] \
                  && build_file_chapters "$SRC" /work/tmp/chapters.ffmeta; then
                  CH=/work/tmp/chapters.ffmeta
                  echo "chapters: derived from $NFILES source files"
                fi
              fi

              # Re-mux (-c copy, no re-encode): embed our global tags (beets
              # overwrites them on a good match), the chosen chapters and the
              # cover. Inputs are added conditionally; $idx tracks the ffmpeg
              # input index. A failure here must not throw away the merge - keep
              # the file as merged and let beets do what it can.
              rm -f "$BOOK.new"
              set -- -nostdin -v error -i "$BOOK"
              idx=0
              meta_idx=0
              if [ -s /work/tags.ffmeta ]; then
                idx=$((idx + 1)); set -- "$@" -i /work/tags.ffmeta; meta_idx=$idx
              fi
              ch_idx=""
              if [ -n "$CH" ]; then
                idx=$((idx + 1)); set -- "$@" -i "$CH"; ch_idx=$idx
              fi
              cov_idx=""
              if [ -s /work/cover.jpg ]; then
                idx=$((idx + 1)); set -- "$@" -i /work/cover.jpg; cov_idx=$idx
              fi
              set -- "$@" -map 0:a -map_metadata "$meta_idx"
              [ -n "$ch_idx" ] && set -- "$@" -map_chapters "$ch_idx"
              if [ -n "$cov_idx" ]; then
                set -- "$@" -map "$cov_idx:v" -disposition:v attached_pic
              fi
              set -- "$@" -c copy -f mp4 "$BOOK.new"
              ffmpeg "$@" || true
              [ -s "$BOOK.new" ] && mv "$BOOK.new" "$BOOK" || rm -f "$BOOK.new"
              echo "final: $BOOK (chapters=$(chapter_count "$BOOK"))"

              # metadata.yml must sit in the import folder - beets-audible reads
              # it from there and skips the fuzzy Audible lookup.
              [ -s /work/metadata.yml ] && cp /work/metadata.yml "$DEST/metadata.yml"
              exit 0
          env:
            - { name: SOURCE_PATH_B64, value: "__SOURCE_PATH_B64__" }
            - { name: TITLE_B64, value: "__TITLE_B64__" }
            - { name: AUTHOR_B64, value: "__AUTHOR_B64__" }
            - { name: HOME, value: "/work" }
            - { name: TMPDIR, value: "/work/tmp" }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: media, mountPath: /media }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "4", memory: 1Gi }
      containers:
        - name: beets
          image: ghcr.io/neopterygii/beets-audible:latest@sha256:583c2839a5cbe27a8f215e8f157a65f3c924f88c327001d0cdd4acae55fabef0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              export HOME=/config BEETSDIR=/config
              BOOK="$(find /work/merged -mindepth 1 -maxdepth 1 -type d | head -n1)"
              if [ -z "$BOOK" ]; then
                echo "no merged book directory in /work/merged - nothing to import"
                exit 0
              fi
              # metadata.yml (when asin_lookup resolved an ASIN) drives tagging
              # deterministically; otherwise beets imports as-is with the tags
              # the merge step embedded from the Shelfmark title / author.
              # No --search-id: album_for_id returns one track per Audnex chapter,
              # which never strong-matches a single merged file in quiet mode.
              echo "importing: $BOOK"
              if ! /lsiopy/bin/beet -c /cfg/config.yaml import -q "$BOOK"; then
                echo "beet import failed - moving merged output to _unsorted"
                mkdir -p /media/media/audiobooks/library/_unsorted
                mv "$BOOK"/* /media/media/audiobooks/library/_unsorted/
                exit 0
              fi

              # beets-audible does not fetch cover art on the metadata.yml path,
              # and there is no copyartifacts plugin. The library DB lives on an
              # emptyDir, so it holds exactly this one book - drop cover.jpg and
              # metadata.yml next to the placed .m4b (desc.txt / reader.txt are
              # already written there by the plugin).
              FIRST_ITEM="$(/lsiopy/bin/beet -c /cfg/config.yaml list -p 2>/dev/null | head -n1 || true)"
              DEST_DIR=""
              [ -n "$FIRST_ITEM" ] && DEST_DIR="$(dirname "$FIRST_ITEM")"
              if [ -n "$DEST_DIR" ] && [ -d "$DEST_DIR" ]; then
                echo "placed in: $DEST_DIR"
                [ -s /work/cover.jpg ] && cp /work/cover.jpg "$DEST_DIR/cover.jpg"
                [ -s "$BOOK/metadata.yml" ] && cp "$BOOK/metadata.yml" "$DEST_DIR/metadata.yml"
              fi
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: media, mountPath: /media }
            - { name: beets-config, mountPath: /cfg, readOnly: true }
            - { name: beets-home, mountPath: /config }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        - name: work
          emptyDir: { sizeLimit: 12Gi }
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        - name: beets-home
          emptyDir: {}
        - name: media
          nfs:
            server: nas.internal
            path: /media-root
        - name: scripts
          configMap:
            name: audiobook-m4b-scripts
            defaultMode: 0755
        - name: beets-config
          configMap:
            name: audiobook-m4b-beets
