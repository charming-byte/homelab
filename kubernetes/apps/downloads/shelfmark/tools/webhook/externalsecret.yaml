---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webhook
spec:
  dataFrom:
    - extract:
        key: shelfmark
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: webhook-secret
    template:
      data:
        SHELFMARK_WEBHOOK_SECRET: "{{ .SHELFMARK_WEBHOOK_SECRET }}"
