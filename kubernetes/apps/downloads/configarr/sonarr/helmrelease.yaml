---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: configarr-sonarr
spec:
  chartRef:
    kind: OCIRepository
    name: configarr-sonarr
  interval: 1h
  values:
    controllers:
      configarr-sonarr:
        type: cronjob
        cronjob:
          schedule: 0 0 * * 1
          timeZone: Europe/Berlin
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 18000
        containers:
          app:
            image:
              repository: ghcr.io/raydak-labs/configarr
              tag: 1.34@sha256:3443bef6be53f7f8580bad13f6e7946cabc80ba4e4f247e2a23b767febd7af3c
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            env:
              TZ: Europe/Berlin
        pod:
          restartPolicy: Never
    persistence:
      app-data:
        type: persistentVolumeClaim
        size: 1Gi
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /app/repos
      config:
        type: configMap
        name: configarr-sonarr-configmap
        globalMounts:
          - path: /app/config/config.yml
            subPath: config.yml
            readOnly: true
