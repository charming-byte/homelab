---
radarrEnabled: true
sonarrEnabled: false
lidarrEnabled: false
readarrEnabled: false
whisparrEnabled: false

telemetry: false

radarr:
  instance1:
    base_url: http://radarr.downloads.svc.cluster.local
    api_key: !env RADARR_API_KEY

    quality_definition:
      type: movie

    include:
      # [German] HD Bluray + WEB
      - template: 2b90e905c99490edc7c7a5787443748b
        source: TRASH

      # [German] Anime HD Bluray + WEB
      - template: bf3cc2e99ad9a804a9b0d0e538e1fbba
        source: TRASH

    renameQualityProfiles:
      - from: "[German] HD Bluray + WEB"
        to: "German"

