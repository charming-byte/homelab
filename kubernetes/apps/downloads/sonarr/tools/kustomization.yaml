---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.config.k8s.io/kustomization_v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./tv-charts-prune
configMapGenerator:
  # Mounted read-only into the tv-charts-prune CronJob pods.
  - name: tv-charts-prune-scripts
    files:
      - resources/tv_charts_prune.py
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
