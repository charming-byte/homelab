---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deemix
spec:
  chartRef:
    kind: OCIRepository
    name: deemix
  interval: 1h
  values:
    controllers:
      deemix:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            env:
              DEEMIX_SERVER_PORT: 80
              DEEMIX_DATA_DIR: /config
              DEEMIX_MUSIC_DIR: /media/downloads/deemix
              DISABLE_OWNERSHIP_CHECK: "true"
              TZ: Europe/Berlin
            image:
              repository: ghcr.io/bambanah/deemix
              tag: v4.6.0@sha256:5ac6df2b8b3267cfc9c7599c57d0be850ebb1fb66fb2d42e7258491ebf3318d4
            probes:
              liveness: &probes
                custom: true
                enabled: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
    persistence:
      config:
        accessMode: ReadWriteOnce
        advancedMounts:
          deemix:
            app:
              - path: /config
        size: 3Gi
        storageClass: local-hostpath
        type: persistentVolumeClaim
      media:
        advancedMounts:
          deemix:
            app:
              - path: /media
        enabled: true
        path: /media-root
        server: nas.internal
        type: nfs
      tmp:
        type: emptyDir
    route:
      deemix:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Deemix
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: deemix
                port: 80
    service:
      app:
        ports:
          http:
            port: 80
